name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format . --check

      - name: Test
        run: uv run pytest

      - name: Compile
        run: uv run python -m compileall src tests

      - name: CLI smoke
        run: |
          uv run repo-radar --help
          uv run repo-radar config-check --config repo_radar.yaml
          uv run repo-radar scan --dry-run
          uv run repo-radar handoff
